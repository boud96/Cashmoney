{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {# Bank texts are shown everywhere; nothing but the app's own code may run. AG Grid and Plotly add <style> tags, hence 'unsafe-inline' for styles. #}
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Cashmoney</title>
    <link rel="icon" href="{% static 'favicon.ico' %}">
    {% for css_file in react_entry_css %}
        <link rel="stylesheet" href="{% static 'finance/react/'|add:css_file %}">
    {% endfor %}
</head>
<body>
    <div id="root">
        {% if not react_entry_js %}
            <div style="font-family: system-ui, sans-serif; padding: 24px;">
                React frontend has not been built yet. Run <code>.\build_frontend.bat</code>
                (Windows) or <code>./build_frontend.sh</code> (Linux) from the project root.
            </div>
        {% endif %}
    </div>
    {% if react_entry_js %}
        <script type="module" src="{% static 'finance/react/'|add:react_entry_js %}"></script>
    {% endif %}
</body>
</html>
